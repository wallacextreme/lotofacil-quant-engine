<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fundo com cantos arredondados (squircle) -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="510" height="510" x="1" y="1" rx="127" fill="none" stroke="url(#glowGrad)" stroke-width="4" opacity="0.4" />

  <!-- Grade 5x5 estilizada sutil -->
  <g opacity="0.15" fill="#38bdf8">
    <circle cx="156" cy="156" r="10" />
    <circle cx="206" cy="156" r="10" />
    <circle cx="256" cy="156" r="10" />
    <circle cx="306" cy="156" r="10" />
    <circle cx="356" cy="156" r="10" />

    <circle cx="156" cy="206" r="10" />
    <circle cx="206" cy="206" r="10" />
    <circle cx="256" cy="206" r="10" />
    <circle cx="306" cy="206" r="10" />
    <circle cx="356" cy="206" r="10" />

    <circle cx="156" cy="256" r="10" />
    <circle cx="206" cy="256" r="10" />
    <circle cx="256" cy="256" r="10" />
    <circle cx="306" cy="256" r="10" />
    <circle cx="356" cy="256" r="10" />

    <circle cx="156" cy="306" r="10" />
    <circle cx="206" cy="306" r="10" />
    <circle cx="256" cy="306" r="10" />
    <circle cx="306" cy="306" r="10" />
    <circle cx="356" cy="306" r="10" />

    <circle cx="156" cy="356" r="10" />
    <circle cx="206" cy="356" r="10" />
    <circle cx="256" cy="356" r="10" />
    <circle cx="306" cy="356" r="10" />
    <circle cx="356" cy="356" r="10" />
  </g>

  <!-- Anel Quântico Orbitando -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#glowGrad)" stroke-width="8" filter="url(#glow)" stroke-dasharray="24 16" />

  <!-- Tipografia Monocromática Moderna "LQ" -->
  <text x="256" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="140" fill="#ffffff" text-anchor="middle" letter-spacing="-6">
    LQ
  </text>
  <text x="256" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="28" fill="#38bdf8" text-anchor="middle" letter-spacing="4">
    QUANT ENGINE
  </text>
</svg>
